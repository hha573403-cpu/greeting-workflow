name: Daily Greeting Scheduler

on:
  schedule:
    # 早安：北京时间9:30 (UTC 1:30)
    - cron: '30 1 * * *'
    # 午饭：北京时间12:00 (UTC 4:00)
    - cron: '0 4 * * *'
    # 午休：北京时间12:30 (UTC 4:30)
    - cron: '30 4 * * *'
    # 下午茶：北京时间15:30 (UTC 7:30)
    - cron: '30 7 * * *'
    # 下班：北京时间18:00 (UTC 10:00)
    - cron: '0 10 * * *'
    # 晚安：北京时间22:00 (UTC 14:00)
    - cron: '0 14 * * *'
  workflow_dispatch:  # 支持手动触发测试
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'greeting'
        type: choice
        options:
          - greeting
          - note
      greeting_type:
        description: '问候类型（仅greeting模式有效）'
        required: false
        default: '早安'
        type: choice
        options:
          - 早安
          - 午饭
          - 午休
          - 下午茶
          - 下班
          - 晚安
      note_type:
        description: '笔记类型（仅note模式有效）'
        required: false
        default: '收藏型'
        type: choice
        options:
          - 收藏型
          - 讨论型
      theme:
        description: '主题方向（仅note模式有效）'
        required: false
        default: '养生打工人'
        type: string

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: uv sync
      
      - name: Determine greeting type from schedule
        id: determine_type
        run: |
          # 根据当前时间确定问候类型
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          
          # 北京时间 = UTC + 8
          BEIJING_HOUR=$((HOUR + 8))
          if [ $BEIJING_HOUR -ge 24 ]; then
            BEIJING_HOUR=$((BEIJING_HOUR - 24))
          fi
          
          # 确定问候类型
          if [ "$BEIJING_HOUR" = "9" ] && [ "$MINUTE" = "30" ]; then
            echo "type=早安" >> $GITHUB_OUTPUT
          elif [ "$BEIJING_HOUR" = "12" ] && [ "$MINUTE" = "00" ]; then
            echo "type=午饭" >> $GITHUB_OUTPUT
          elif [ "$BEIJING_HOUR" = "12" ] && [ "$MINUTE" = "30" ]; then
            echo "type=午休" >> $GITHUB_OUTPUT
          elif [ "$BEIJING_HOUR" = "15" ] && [ "$MINUTE" = "30" ]; then
            echo "type=下午茶" >> $GITHUB_OUTPUT
          elif [ "$BEIJING_HOUR" = "18" ] && [ "$MINUTE" = "00" ]; then
            echo "type=下班" >> $GITHUB_OUTPUT
          elif [ "$BEIJING_HOUR" = "22" ] && [ "$MINUTE" = "00" ]; then
            echo "type=晚安" >> $GITHUB_OUTPUT
          else
            echo "type=早安" >> $GITHUB_OUTPUT
          fi
      
      - name: Run workflow
        env:
          COZE_WORKSPACE_PATH: ${{ github.workspace }}
          COZE_WORKLOAD_IDENTITY_API_KEY: ${{ secrets.ARK_API_KEY }}
          COZE_INTEGRATION_BASE_URL: https://api.coze.cn
          COZE_INTEGRATION_MODEL_BASE_URL: ${{ secrets.ARK_BASE_URL }}
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "note" ]; then
            uv run python src/scheduler/greeting_scheduler.py --mode note --note-type "${{ inputs.note_type }}" --theme "${{ inputs.theme }}"
          elif [ "${{ inputs.greeting_type }}" != "" ]; then
            uv run python src/scheduler/greeting_scheduler.py --mode greeting --greeting-type "${{ inputs.greeting_type }}"
          else
            uv run python src/scheduler/greeting_scheduler.py --mode greeting --greeting-type "${{ steps.determine_type.outputs.type }}"
          fi
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greeting-logs
          path: logs/