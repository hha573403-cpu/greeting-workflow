name: Daily Greeting Scheduler

on:
  schedule:
    # 每天9:30运行（UTC时间1:30，北京时间+8小时）
    - cron: '30 1 * * *'
  workflow_dispatch:  # 支持手动触发测试

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 最多运行10分钟
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run greeting workflow
        env:
          COZE_WORKSPACE_PATH: ${{ github.workspace }}
          COZE_WORKLOAD_IDENTITY_API_KEY: ${{ secrets.ARK_API_KEY }}
          COZE_INTEGRATION_BASE_URL: https://api.coze.cn
          COZE_INTEGRATION_MODEL_BASE_URL: ${{ secrets.ARK_BASE_URL }}
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
          COZE_BUCKET_ENDPOINT_URL: ${{ secrets.COZE_BUCKET_ENDPOINT_URL }}
          COZE_BUCKET_NAME: ${{ secrets.COZE_BUCKET_NAME }}
        run: uv run python src/scheduler/greeting_scheduler.py
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greeting-logs
          path: logs/