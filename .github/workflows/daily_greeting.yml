name: Daily Greeting Scheduler

on:
  repository_dispatch:  # 支持外部API触发
    types:
      - morning      # 早安
      - lunch        # 午饭
      - lunch_rest   # 午休
      - afternoon    # 下午茶
      - evening      # 下班
      - night        # 晚安
      - note         # 笔记内容
  workflow_dispatch:  # 支持手动触发测试
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'greeting'
        type: choice
        options:
          - greeting
          - note
      greeting_type:
        description: '问候类型（仅greeting模式有效）'
        required: false
        default: '早安'
        type: choice
        options:
          - 早安
          - 午饭
          - 午休
          - 下午茶
          - 下班
          - 晚安
      note_type:
        description: '笔记类型（仅note模式有效）'
        required: false
        default: '收藏型'
        type: choice
        options:
          - 收藏型
          - 讨论型
      theme:
        description: '主题方向（仅note模式有效）'
        required: false
        default: '养生打工人'
        type: string

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: uv sync
      
      - name: Determine greeting type
        id: determine_type
        run: |
          # 从repository_dispatch事件类型确定问候类型
          EVENT_TYPE="${{ github.event.action }}"
          
          case "$EVENT_TYPE" in
            morning)    echo "type=早安" >> $GITHUB_OUTPUT ;;
            lunch)      echo "type=午饭" >> $GITHUB_OUTPUT ;;
            lunch_rest) echo "type=午休" >> $GITHUB_OUTPUT ;;
            afternoon)  echo "type=下午茶" >> $GITHUB_OUTPUT ;;
            evening)    echo "type=下班" >> $GITHUB_OUTPUT ;;
            night)      echo "type=晚安" >> $GITHUB_OUTPUT ;;
            note)       echo "type=笔记" >> $GITHUB_OUTPUT ;;
            *)          echo "type=早安" >> $GITHUB_OUTPUT ;;
          esac
      
      - name: Run workflow
        env:
          COZE_WORKSPACE_PATH: ${{ github.workspace }}
          COZE_WORKLOAD_IDENTITY_API_KEY: ${{ secrets.COZE_API_KEY }}
          COZE_INTEGRATION_BASE_URL: https://integration.coze.cn
          COZE_INTEGRATION_MODEL_BASE_URL: https://integration.coze.cn/api/v3
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
        run: |
          TYPE="${{ steps.determine_type.outputs.type }}"
          
          # 判断是手动触发还是外部触发
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "note" ]; then
              uv run python src/scheduler/greeting_scheduler.py --mode note --note-type "${{ inputs.note_type }}" --theme "${{ inputs.theme }}"
            else
              uv run python src/scheduler/greeting_scheduler.py --mode greeting --greeting-type "${{ inputs.greeting_type }}"
            fi
          elif [ "$TYPE" = "笔记" ]; then
            # 外部触发笔记内容
            NOTE_TYPE="${{ github.event.client_payload.note_type }}"
            THEME="${{ github.event.client_payload.theme }}"
            uv run python src/scheduler/greeting_scheduler.py --mode note --note-type "$NOTE_TYPE" --theme "$THEME"
          else
            # 外部触发问候推送
            uv run python src/scheduler/greeting_scheduler.py --mode greeting --greeting-type "$TYPE"
          fi
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greeting-logs
          path: logs/